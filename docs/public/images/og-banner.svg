<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c0f14;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#12161c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1f28;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#14b8a6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="tealGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#14b8a6;stop-opacity:0.05" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Decorative grid pattern -->
  <g opacity="0.1">
    <line x1="0" y1="100" x2="1200" y2="100" stroke="#14b8a6" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#14b8a6" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#14b8a6" stroke-width="0.5"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke="#14b8a6" stroke-width="0.5"/>
    <line x1="0" y1="500" x2="1200" y2="500" stroke="#14b8a6" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="630" stroke="#14b8a6" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="630" stroke="#14b8a6" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="#14b8a6" stroke-width="0.5"/>
    <line x1="800" y1="0" x2="800" y2="630" stroke="#14b8a6" stroke-width="0.5"/>
    <line x1="1000" y1="0" x2="1000" y2="630" stroke="#14b8a6" stroke-width="0.5"/>
  </g>

  <!-- Logo box -->
  <rect x="80" y="80" width="80" height="80" rx="12" fill="#14b8a6"/>
  <text x="120" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" fill="white" text-anchor="middle">HPI</text>

  <!-- Title -->
  <text x="180" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="url(#brandGradient)">Hetero-Paged-Infer</text>

  <!-- Tagline -->
  <text x="180" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#9ca3af">High-Performance LLM Inference Engine</text>

  <!-- Feature badges -->
  <g transform="translate(80, 220)">
    <!-- Badge 1: PagedAttention -->
    <rect x="0" y="0" width="180" height="36" rx="6" fill="#14b8a6" opacity="0.15"/>
    <rect x="0" y="0" width="180" height="36" rx="6" fill="none" stroke="#14b8a6" stroke-width="1"/>
    <text x="90" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#14b8a6" text-anchor="middle" font-weight="500">PagedAttention</text>

    <!-- Badge 2: Continuous Batching -->
    <rect x="200" y="0" width="200" height="36" rx="6" fill="#8b5cf6" opacity="0.15"/>
    <rect x="200" y="0" width="200" height="36" rx="6" fill="none" stroke="#8b5cf6" stroke-width="1"/>
    <text x="300" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#8b5cf6" text-anchor="middle" font-weight="500">Continuous Batching</text>

    <!-- Badge 3: Rust -->
    <rect x="420" y="0" width="100" height="36" rx="6" fill="#f59e0b" opacity="0.15"/>
    <rect x="420" y="0" width="100" height="36" rx="6" fill="none" stroke="#f59e0b" stroke-width="1"/>
    <text x="470" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#f59e0b" text-anchor="middle" font-weight="500">Rust</text>
  </g>

  <!-- Stats cards -->
  <g transform="translate(80, 320)">
    <!-- Card 1: Memory -->
    <rect x="0" y="0" width="240" height="100" rx="12" fill="url(#tealGradient)"/>
    <rect x="0" y="0" width="240" height="100" rx="12" fill="none" stroke="#14b8a6" stroke-width="1"/>
    <text x="120" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="800" fill="#14b8a6" text-anchor="middle">&lt;5%</text>
    <text x="120" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#9ca3af" text-anchor="middle">Memory Waste</text>

    <!-- Card 2: Throughput -->
    <rect x="260" y="0" width="240" height="100" rx="12" fill="#f59e0b" opacity="0.1"/>
    <rect x="260" y="0" width="240" height="100" rx="12" fill="none" stroke="#f59e0b" stroke-width="1"/>
    <text x="380" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="800" fill="#f59e0b" text-anchor="middle">+50%</text>
    <text x="380" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#9ca3af" text-anchor="middle">Throughput Gain</text>

    <!-- Card 3: Tests -->
    <rect x="520" y="0" width="240" height="100" rx="12" fill="#8b5cf6" opacity="0.1"/>
    <rect x="520" y="0" width="240" height="100" rx="12" fill="none" stroke="#8b5cf6" stroke-width="1"/>
    <text x="640" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="800" fill="#8b5cf6" text-anchor="middle">122+</text>
    <text x="640" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#9ca3af" text-anchor="middle">Tests Passed</text>

    <!-- Card 4: Unsafe -->
    <rect x="780" y="0" width="240" height="100" rx="12" fill="#22c55e" opacity="0.1"/>
    <rect x="780" y="0" width="240" height="100" rx="12" fill="none" stroke="#22c55e" stroke-width="1"/>
    <text x="900" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="800" fill="#22c55e" text-anchor="middle">0</text>
    <text x="900" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#9ca3af" text-anchor="middle">Unsafe Code</text>
  </g>

  <!-- Architecture illustration -->
  <g transform="translate(80, 480)">
    <!-- CPU box -->
    <rect x="0" y="0" width="200" height="60" rx="8" fill="#14b8a6" opacity="0.15"/>
    <rect x="0" y="0" width="200" height="60" rx="8" fill="none" stroke="#14b8a6" stroke-width="1"/>
    <text x="100" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#14b8a6" text-anchor="middle" font-weight="600">CPU Control Plane</text>
    <text x="100" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">Scheduler • KV Manager</text>

    <!-- Arrow -->
    <path d="M210 30 L240 30" stroke="#14b8a6" stroke-width="2" fill="none"/>
    <polygon points="240,25 250,30 240,35" fill="#14b8a6"/>

    <!-- GPU box -->
    <rect x="260" y="0" width="200" height="60" rx="8" fill="#8b5cf6" opacity="0.15"/>
    <rect x="260" y="0" width="200" height="60" rx="8" fill="none" stroke="#8b5cf6" stroke-width="1"/>
    <text x="360" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#8b5cf6" text-anchor="middle" font-weight="600">GPU Compute Plane</text>
    <text x="360" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">Executor • KV Cache</text>

    <!-- Memory bar illustration -->
    <rect x="500" y="15" width="300" height="30" rx="4" fill="#1a1f28"/>
    <rect x="500" y="15" width="285" height="30" rx="4" fill="#14b8a6" opacity="0.5"/>
    <text x="650" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="white" text-anchor="middle">Efficient Memory Usage</text>
  </g>

  <!-- Footer -->
  <text x="1200" y="610" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">github.com/LessUp/hetero-paged-infer</text>
</svg>
