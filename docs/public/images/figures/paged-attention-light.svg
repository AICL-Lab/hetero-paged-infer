<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="title desc">
  <title id="title">PagedAttention mapping light</title>
  <desc id="desc">Logical blocks map through a page table into reusable physical KV blocks.</desc>
  <rect width="960" height="520" rx="28" fill="#f8fafc"/>
  <rect x="36" y="36" width="888" height="448" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="72" y="84" fill="#0f172a" font-size="32" font-weight="700" font-family="Inter, Arial, sans-serif">PagedAttention block mapping</text>
  <text x="72" y="116" fill="#475569" font-size="18" font-family="Inter, Arial, sans-serif">Logical continuity is preserved even when physical KV blocks are sparse and reusable.</text>

  <text x="104" y="172" fill="#0f172a" font-size="22" font-weight="700" font-family="Inter, Arial, sans-serif">Logical sequence view</text>
  <rect x="104" y="196" width="188" height="64" rx="18" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
  <text x="132" y="235" fill="#0f172a" font-size="21" font-weight="600" font-family="Inter, Arial, sans-serif">Block 0</text>
  <rect x="104" y="278" width="188" height="64" rx="18" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
  <text x="132" y="317" fill="#0f172a" font-size="21" font-weight="600" font-family="Inter, Arial, sans-serif">Block 1</text>
  <rect x="104" y="360" width="188" height="64" rx="18" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
  <text x="132" y="399" fill="#0f172a" font-size="21" font-weight="600" font-family="Inter, Arial, sans-serif">Block 2</text>

  <text x="384" y="172" fill="#0f172a" font-size="22" font-weight="700" font-family="Inter, Arial, sans-serif">Page table</text>
  <rect x="348" y="196" width="236" height="64" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="384" y="235" fill="#1d4ed8" font-size="22" font-weight="700" font-family="Inter, Arial, sans-serif">0 → physical 3</text>
  <rect x="348" y="278" width="236" height="64" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="384" y="317" fill="#1d4ed8" font-size="22" font-weight="700" font-family="Inter, Arial, sans-serif">1 → physical 7</text>
  <rect x="348" y="360" width="236" height="64" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="384" y="399" fill="#1d4ed8" font-size="22" font-weight="700" font-family="Inter, Arial, sans-serif">2 → physical 12</text>

  <text x="676" y="172" fill="#0f172a" font-size="22" font-weight="700" font-family="Inter, Arial, sans-serif">Physical KV block pool</text>
  <rect x="640" y="196" width="220" height="64" rx="18" fill="#082f49"/>
  <text x="672" y="220" fill="#bae6fd" font-size="15" font-family="Inter, Arial, sans-serif">active</text>
  <text x="672" y="240" fill="#ecfeff" font-size="21" font-weight="700" font-family="Inter, Arial, sans-serif">Block 3 · ref=1</text>
  <text x="672" y="258" fill="#7dd3fc" font-size="14" font-family="Inter, Arial, sans-serif">tokens 0–15</text>
  <rect x="640" y="278" width="220" height="64" rx="18" fill="#082f49"/>
  <text x="672" y="302" fill="#bae6fd" font-size="15" font-family="Inter, Arial, sans-serif">active</text>
  <text x="672" y="322" fill="#ecfeff" font-size="21" font-weight="700" font-family="Inter, Arial, sans-serif">Block 7 · ref=1</text>
  <text x="672" y="340" fill="#7dd3fc" font-size="14" font-family="Inter, Arial, sans-serif">tokens 16–31</text>
  <rect x="640" y="360" width="220" height="64" rx="18" fill="#082f49"/>
  <text x="672" y="384" fill="#bae6fd" font-size="15" font-family="Inter, Arial, sans-serif">active</text>
  <text x="666" y="404" fill="#ecfeff" font-size="21" font-weight="700" font-family="Inter, Arial, sans-serif">Block 12 · ref=1</text>
  <text x="672" y="422" fill="#7dd3fc" font-size="14" font-family="Inter, Arial, sans-serif">tokens 32–47</text>

  <path d="M292 228H348" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  <polygon points="348,228 330,216 330,240" fill="#38bdf8"/>
  <path d="M292 310H348" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  <polygon points="348,310 330,298 330,322" fill="#38bdf8"/>
  <path d="M292 392H348" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  <polygon points="348,392 330,380 330,404" fill="#38bdf8"/>

  <path d="M584 228H640" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round"/>
  <polygon points="640,228 622,216 622,240" fill="#0ea5e9"/>
  <path d="M584 310H640" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round"/>
  <polygon points="640,310 622,298 622,322" fill="#0ea5e9"/>
  <path d="M584 392H640" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round"/>
  <polygon points="640,392 622,380 622,404" fill="#0ea5e9"/>
</svg>
