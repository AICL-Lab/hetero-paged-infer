<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-labelledby="title desc">
  <title id="title">Architecture overview light</title>
  <desc id="desc">Diagram showing the control plane on the left and compute plane on the right.</desc>
  <rect width="960" height="640" rx="32" fill="#f8fafc"/>
  <rect x="40" y="40" width="880" height="560" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="72" y="95" fill="#0f172a" font-size="34" font-weight="700" font-family="Inter, Arial, sans-serif">Hetero-Paged-Infer architecture</text>
  <text x="72" y="130" fill="#475569" font-size="18" font-family="Inter, Arial, sans-serif">Control plane decisions stay on CPU; batched execution and KV state live on the compute plane.</text>

  <rect x="72" y="168" width="372" height="376" rx="26" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="100" y="214" fill="#0f172a" font-size="28" font-weight="700" font-family="Inter, Arial, sans-serif">Control plane (CPU)</text>
  <text x="100" y="244" fill="#334155" font-size="18" font-family="Inter, Arial, sans-serif">Admission, scheduling, memory policy, and batch assembly.</text>

  <rect x="100" y="278" width="316" height="64" rx="18" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="128" y="318" fill="#0f172a" font-size="22" font-weight="600" font-family="Inter, Arial, sans-serif">API + Orchestrator</text>
  <text x="128" y="338" fill="#475569" font-size="15" font-family="Inter, Arial, sans-serif">Owns request lifecycle and backpressure.</text>

  <rect x="100" y="360" width="148" height="70" rx="18" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="124" y="401" fill="#0f172a" font-size="20" font-weight="600" font-family="Inter, Arial, sans-serif">Tokenizer</text>
  <text x="124" y="421" fill="#64748b" font-size="14" font-family="Inter, Arial, sans-serif">Text ⇄ IDs</text>

  <rect x="268" y="360" width="148" height="70" rx="18" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="292" y="401" fill="#0f172a" font-size="20" font-weight="600" font-family="Inter, Arial, sans-serif">Scheduler</text>
  <text x="292" y="421" fill="#64748b" font-size="14" font-family="Inter, Arial, sans-serif">Decode-first policy</text>

  <rect x="100" y="448" width="148" height="70" rx="18" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="116" y="489" fill="#0f172a" font-size="20" font-weight="600" font-family="Inter, Arial, sans-serif">KV manager</text>
  <text x="116" y="509" fill="#64748b" font-size="14" font-family="Inter, Arial, sans-serif">Block tables</text>

  <rect x="268" y="448" width="148" height="70" rx="18" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <text x="288" y="489" fill="#0f172a" font-size="20" font-weight="700" font-family="Inter, Arial, sans-serif">Batch builder</text>
  <text x="288" y="509" fill="#475569" font-size="14" font-family="Inter, Arial, sans-serif">Ready execution batches</text>

  <rect x="516" y="168" width="372" height="376" rx="26" fill="#ecfeff" stroke="#67e8f9" stroke-width="2"/>
  <text x="544" y="214" fill="#0f172a" font-size="28" font-weight="700" font-family="Inter, Arial, sans-serif">Compute plane (GPU)</text>
  <text x="544" y="244" fill="#334155" font-size="18" font-family="Inter, Arial, sans-serif">High-throughput kernels, KV residency, and token generation.</text>

  <rect x="544" y="290" width="316" height="92" rx="22" fill="#0f172a"/>
  <text x="574" y="332" fill="#f8fafc" font-size="24" font-weight="700" font-family="Inter, Arial, sans-serif">GPU executor</text>
  <text x="574" y="358" fill="#cbd5e1" font-size="15" font-family="Inter, Arial, sans-serif">Attention kernels, graph replay, logits, sampling.</text>

  <rect x="544" y="404" width="316" height="114" rx="22" fill="#082f49"/>
  <text x="574" y="446" fill="#ecfeff" font-size="24" font-weight="700" font-family="Inter, Arial, sans-serif">Paged KV cache</text>
  <rect x="574" y="462" width="52" height="32" rx="8" fill="#38bdf8"/>
  <rect x="638" y="462" width="52" height="32" rx="8" fill="#7dd3fc"/>
  <rect x="702" y="462" width="52" height="32" rx="8" fill="#38bdf8"/>
  <rect x="766" y="462" width="52" height="32" rx="8" fill="#7dd3fc"/>
  <text x="574" y="510" fill="#bae6fd" font-size="15" font-family="Inter, Arial, sans-serif">Reusable physical blocks addressed through page tables.</text>

  <path d="M416 483H516" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round"/>
  <polygon points="516,483 496,471 496,495" fill="#0ea5e9"/>
  <text x="431" y="467" fill="#0369a1" font-size="16" font-weight="600" font-family="Inter, Arial, sans-serif">Execution batch</text>

  <path d="M702 382V404" stroke="#06b6d4" stroke-width="6" stroke-linecap="round"/>
  <polygon points="702,404 690,384 714,384" fill="#06b6d4"/>
  <text x="730" y="396" fill="#0f766e" font-size="16" font-weight="600" font-family="Inter, Arial, sans-serif">reads / writes KV</text>

  <rect x="72" y="560" width="816" height="26" rx="13" fill="#e2e8f0"/>
  <rect x="72" y="560" width="344" height="26" rx="13" fill="#0ea5e9"/>
  <text x="92" y="578" fill="#ffffff" font-size="14" font-weight="700" font-family="Inter, Arial, sans-serif">Control decisions</text>
  <text x="476" y="578" fill="#334155" font-size="14" font-weight="700" font-family="Inter, Arial, sans-serif">Compute and KV residency</text>
</svg>
